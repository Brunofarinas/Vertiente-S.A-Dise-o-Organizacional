html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
a{color:var(--agua)}
header{background:var(--agua);color:#fff;padding:20px clamp(16px,4vw,40px)}
header h1{margin:0;font-size:clamp(22px,4vw,32px);letter-spacing:-.01em}
header p{margin:4px 0 0;opacity:.9;max-width:70ch}
.wrap{display:grid;grid-template-columns:270px 1fr;gap:0;max-width:1200px;margin:0 auto}
nav{padding:20px 16px 20px clamp(16px,3vw,32px);position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
nav h2{font-size:13px;color:var(--mute);font-weight:600;margin:16px 0 6px}
nav a{display:block;text-decoration:none;color:var(--ink);padding:8px 10px 8px 14px;border-left:3px solid var(--line);font-size:14.5px;line-height:1.3}
nav a small{display:block;color:var(--mute);font-size:12px}
nav a:hover{background:var(--agua2)}
nav a[aria-current="page"]{border-left-color:var(--tapa);background:var(--agua2);font-weight:600}
nav a:focus-visible,button:focus-visible{outline:3px solid var(--sol);outline-offset:2px}
main{padding:24px clamp(16px,3vw,32px) 60px;min-width:0}
h2.t{font-size:clamp(22px,3vw,28px);margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin:0 0 16px}
.card h3{margin:0 0 10px;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:8px 24px;margin:0 0 16px}
.meta div{font-size:14px}.meta b{display:block;color:var(--mute);font-weight:600;font-size:12.5px}
.code{display:inline-block;background:var(--tapa);color:#fff;font-weight:700;padding:2px 10px;border-radius:4px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
ol,ul{margin:0;padding-left:20px}li{margin:4px 0}
.comp{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.dots{display:flex;gap:4px;flex:none}.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--agua)}
.kpi{border-left:4px solid var(--sol);padding:4px 12px;margin:8px 0;font-size:14.5px}
.tags span{display:block;margin:4px 0;font-size:14.5px}
.tags b{color:var(--agua)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.pager a{padding:8px 14px;border:1px solid var(--line);border-radius:6px;text-decoration:none;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:13px}
.scroll{overflow-x:auto}
.tree,.tree ul{list-style:none;padding-left:18px;margin:0;border-left:2px solid var(--line)}
.tree{border:0;padding:0}
.tree li{margin:2px 0;padding:2px 0 2px 8px;font-size:14.5px}
.tree li.g>span{font-weight:700}
.tree a{background:var(--tapa);color:#fff;text-decoration:none;padding:1px 8px;border-radius:4px;font-weight:600}
.tree .c{color:var(--mute)}
button.tg{float:right;background:transparent;color:#fff;border:1px solid #ffffff88;border-radius:6px;padding:4px 10px;cursor:pointer}
@media (max-width:820px){.wrap{display:block}nav{position:static;max-height:none;border-bottom:1px solid var(--line)}nav .l{display:flex;flex-wrap:wrap;gap:6px}nav a{border:1px solid var(--line);border-radius:6px;padding:6px 10px}nav a small{display:none}}
</style>
</head>
